name: Clinic
options:
  bundleIdPrefix: com.r0adkll
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
configFiles:
  Debug: Version.xcconfig
  Release: Version.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ARCHS: arm64
    # The flavor (ADR-176). These are the released app's values; `make dev` overrides all three on the
    # xcodebuild command line to build "Clinic Dev", which shares nothing with this one.
    CLINIC_APP_NAME: Clinic
    CLINIC_BUNDLE_ID: com.r0adkll.clinic
    CLINIC_DATA_DIRECTORY: Clinic
    DEAD_CODE_STRIPPING: YES
packages:
  ClinicCore:
    path: Packages/ClinicCore
  GhosttyBridge:
    path: Packages/GhosttyBridge
  CodeEditSourceEditor:
    url: https://github.com/CodeEditApp/CodeEditSourceEditor
    exactVersion: "0.15.2"
targets:
  Clinic:
    type: application
    platform: macOS
    sources:
      - path: Sources/Clinic
        excludes:
          - LaunchAgents
      # SMAppService.agent() reads its plist from Contents/Library/LaunchAgents, and only a *bundled*
      # plist can be registered — which is why the wake interval is a fixed 300 s rather than a
      # computed StartCalendarInterval (ADR-095).
      - path: Sources/Clinic/LaunchAgents/com.r0adkll.clinic.wake.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
      # The session mod (ADR-177), file by file so the type declarations the CLI lays beside it during
      # development stay out of the bundle. HookService copies Resources/clinic-mod out at launch.
      - path: Sources/clinic-mod/.claude-plugin/plugin.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: clinic-mod/.claude-plugin
      - path: Sources/clinic-mod/hooks/hooks.json
        buildPhase:
          copyFiles:
            destination: resources
            subpath: clinic-mod/hooks
      - path: Sources/clinic-mod/hooks/register.ts
        buildPhase:
          copyFiles:
            destination: resources
            subpath: clinic-mod/hooks
    dependencies:
      - package: ClinicCore
      - package: GhosttyBridge
      - package: CodeEditSourceEditor
      - target: clinic-hook
        embed: true
        codeSign: true
        copy:
          destination: executables
      - target: clinic-wake
        embed: true
        codeSign: true
        copy:
          destination: executables
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(CLINIC_BUNDLE_ID)
        PRODUCT_NAME: $(CLINIC_APP_NAME)
        # The module keeps its name whatever the app is called, so "Clinic Dev" is not `Clinic_Dev`.
        PRODUCT_MODULE_NAME: Clinic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Sources/Clinic/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Clinic/Clinic.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_OBJC_BRIDGING_HEADER: ""
    entitlements:
      path: Sources/Clinic/Clinic.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.cs.allow-jit: false
    info:
      path: Sources/Clinic/Info.plist
      properties:
        CFBundleName: $(CLINIC_APP_NAME)
        CFBundleDisplayName: $(CLINIC_APP_NAME)
        # Read by ClinicPaths.directoryName and clinic-wake: the folder under Application Support (ADR-176).
        ClinicDataDirectory: $(CLINIC_DATA_DIRECTORY)
        # Without these XcodeGen writes 1.0 / 1 into the plist and every build reports itself as 1.0 (ADR-153).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: "15.0"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "© 2026 Drew Heavner. MIT."
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleIconName: AppIcon
  clinic-wake:
    type: tool
    platform: macOS
    sources:
      - path: Sources/clinic-wake
    settings:
      base:
        PRODUCT_NAME: clinic-wake
        SKIP_INSTALL: YES
  clinic-hook:
    type: tool
    platform: macOS
    sources:
      - path: Sources/clinic-hook
    settings:
      base:
        PRODUCT_NAME: clinic-hook
        SKIP_INSTALL: YES
schemes:
  Clinic:
    build:
      targets:
        Clinic: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: ClinicCore/ClinicCoreTests
        - package: GhosttyBridge/GhosttyBridgeTests
